<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static.VG</title>
    <link rel="icon" href="assets/PFP2.jpg" type="image/x-icon" style="width: 16px; height: 16px;">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header>
        <div class="logo"><a href="index.html">
            <img src="assets/static-logo.png" alt="Static.VG Brand Logo" class="navbar-logo-img">
        </a></div>
        <nav id="filter-tabs">
            <button class="tab-btn active" data-category="all">All Entries</button>
            <button class="tab-btn" data-category="Review">Reviews</button>
            <button class="tab-btn" data-category="News">News</button>
            <button class="tab-btn" data-category="Patches">Patches</button>
            <button class="tab-btn" data-category="Tips">Tips & Tricks</button>
            <button class="tab-btn" data-category="Interview">Interviews</button>
        </nav>

        <div class="header-controls">
        <button id="theme-toggle" class="theme-toggle-btn">☀️ Light Mode</button>
        <div class="support-btn"><a href="#support">💡 Support Us</a>
    </div>
    </header>

    <main>
        <!-- Search Area -->
        <div class="search-box-container">
            <input type="text" id="search-input" placeholder="🔍 Search reviews, news, tips...">
        </div>

        <!-- Dynamic Hero Grid (Top Stories) -->

        <!-- Asymmetric 3-Column Premium Showcase Hero Grid -->
        <section id="hero-grid" class="premium-hybrid-layout">
            <!-- Column 1: Massive Spotlight Spotlight Feature Story -->
            <div id="hero-main-spotlight"></div>
            
            <!-- Column 2: Vertical Middle Stack Split Elements -->
            <div id="hero-center-stack"></div>
            
            <!-- Column 3: Fast-Scannable Live Action Timeline Feed Feed -->
            <div id="hero-right-timeline">
                <h3 class="timeline-title">⚡ LATEST ROUNDUP</h3>
                <div id="timeline-scroll-box"></div>
            </div>
        </section>


        <!-- Main Content Area -->
        <div class="content-wrapper">
            <section id="articles-feed">
                <h2>Latest Entries</h2>
                <div id="dynamic-feed"><!-- All categorized content lands here via JS --></div>
            </section>

            <!-- Sidebar (Top Charts, Non-Intrusive Ads, Support) -->
            <aside>
                <div class="widget" id="support">
                    <h3>Players-First Mission</h3>
                    <p>No corporate shareholders. No 10-minute read times for 1 sentence of news. Just games.</p>
                    <a href="https://ko-fi.com" target="_blank" class="donate-button">Buy us a Coffee (Ko-Fi)</a>
                </div>

                <div class="widget" id="top-charts">
                    <h3>Top Games of the Month</h3>
                    <ol id="charts-list"><!-- Injected by JS --></ol>
                </div>

                <div class="widget ethical-ad">
                    <span class="ad-label">Sponsored Alternative</span>
                    <div id="sponsor-spot"><!-- Free custom sponsor banner goes here --></div>
                </div>
            </aside>
        </div>
    </main>

    <script src="app.js"></script>
        
    <!-- The Hidden Review Modal Pop-up Frame -->
    <div id="review-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-icon">&times;</span>
        <div class="modal-badges-container">
        <span id="modal-category" class="badge">Category</span>
        <div id="modal-score-wrap"></div>
        </div>
            <h1 id="modal-title">Review Title</h1>
            <p id="modal-date" class="modal-date-text"></p>
            <hr class="modal-divider">
            <div id="modal-body" class="modal-body-text">Full text goes here...</div>
        </div>
    </div>

</body>
</html>
